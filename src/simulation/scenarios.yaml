  description: Lead gives data across messages (with unsolicited CPF/e-mail), picks a plan, accepts.
  contact: "5511900000001"
  contact_name: Ursula Souza
  messages:
    - Oi, queria fazer um seguro pro meu carro
    - e um Corolla 2022
    - Tenho 35 anos, cep 01310-100, cpf 389.083.863-43
    - meu email é ursula.souza@gmail.com e o whats é esse mesmo +55 21 97224-2584
    - quero que comece dia 15
    - completo
    - fechado!
  expect:
    final_state: handoff
    handoff_reason: plan_accepted
    quoted: true

