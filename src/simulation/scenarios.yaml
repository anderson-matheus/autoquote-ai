- name: quote_api_outage_then_recovery
  description: >
    /quote fails on every attempt (injected 503s) -> no invented price, handoff with
    reason quote_unavailable; the background worker retries once the API recovers and
    delivers the quote automatically, closing the handoff ticket.
  contact: "5511900000006"
  contact_name: Felipe Costa
  faults:
    quote_failures: 4
  run_requote_worker: true
  messages:
    - Boa tarde, quero uma cotacao
    - Toyota Yaris 2020, tenho 52 anos, CEP 30140-071, começar amanhã
    - essencial
  expect:
    final_state: presenting
    quoted: true
