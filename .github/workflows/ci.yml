name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make lint
      - run: make type
      - run: make arch
      - run: make security

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (unit, integration on PostgreSQL, contract, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoquote
          POSTGRES_PASSWORD: autoquote
          POSTGRES_DB: autoquote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoquote" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://autoquote:autoquote@localhost:5432/autoquote
      DATABASE_URL: postgresql+asyncpg://autoquote:autoquote@localhost:5432/autoquote
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make test
      - name: Migrations match models
        # The test fixtures drop their tables on teardown, so the database is empty here.
        run: make migrations-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t autoquote-ai:${{ github.sha }} .
      - name: Trivy (fail on fixable HIGH/CRITICAL in OS packages and Python deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autoquote-ai:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy misconfiguration scan (Dockerfiles, compose)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      # The agent writes logs/ as the host user (bind mount).
      - run: echo "AGENT_UID=$(id -u)" >> "$GITHUB_ENV" && echo "AGENT_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose up --build -d --wait
      - run: curl -fsS localhost:8000/health && curl -fsS localhost:8000/planos > /dev/null
      - run: curl -fsS localhost:8080/ready
      - run: docker compose exec -T agent python -m src.main --run-simulation
      - run: docker compose exec -T agent pytest tests/ -q
      - name: Execution log exists and contains no PII
        run: |
          test -s logs/execution.log
          grep -q '"event": "quote_succeeded"' logs/execution.log
          ! grep -E '389\.083\.863-43|ursula\.souza@|97224-2584|Ursula Souza' logs/execution.log
      - if: failure()
        run: docker compose logs --no-color
