name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make lint
      - run: make type
      - run: make security

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests (unit, integration on PostgreSQL, contract, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoquote
          POSTGRES_PASSWORD: autoquote
          POSTGRES_DB: autoquote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoquote" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://autoquote:autoquote@localhost:5432/autoquote
      DATABASE_URL: postgresql+asyncpg://autoquote:autoquote@localhost:5432/autoquote
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make test
      - name: Migrations match models
        # The test fixtures drop their tables on teardown, so the database is empty here.
        run: make migrations-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: curl -fsS localhost:8000/health && curl -fsS localhost:8000/planos > /dev/null
      - run: curl -fsS localhost:8080/ready
      - run: docker compose exec -T agent python -m src.main --run-simulation
      - run: docker compose exec -T agent pytest tests/ -q
      - name: No PII in the execution log
        run: "! grep -E '389\\.083\\.863-43|ursula\\.souza@|97224-2584' logs/execution.log"
      - if: failure()
        run: docker compose logs --no-color
