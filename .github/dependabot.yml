# Weekly dependency updates, grouped to keep PR noise low. Every PR runs the full CI.
# The vendored legacy service (quote-service/) is deliberately excluded: it is kept
# identical to the challenge's original (ADR 0008).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
