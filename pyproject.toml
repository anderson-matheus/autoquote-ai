[project]
name = "autoquote-ai"
version = "0.1.0"
description = "WhatsApp agent that qualifies car-insurance leads, quotes through a flaky legacy API and hands off to humans with explicit criteria."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "cryptography>=43",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "import-linter>=2.15",
]
eval = ["polars>=1.5"]

[tool.uv]
package = false
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["quote-service"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "RET", "PL", "TRY"]
ignore = [
    "PLR0913", "PLR0917",  # explicit DI constructors / repository methods take many args
    "PLR0911",  # state-machine handlers and renderers are clearer with early returns
    "PLR2004",  # magic values are fine in tests/thresholds that are named at the call site
    "TRY003",   # contextual exception messages are useful
    "RUF001", "RUF003",  # pt-BR customer-facing text legitimately contains accents
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR0915", "PLC0415"]
"scripts/**" = ["T201", "PLC0415"]
"src/infra/db/migrations/**" = ["E501", "W291"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "polars.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = [".", "quote-service"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external infrastructure (PostgreSQL); skipped when unavailable",
    "e2e: full conversation scenarios against the real quote-service app",
]
filterwarnings = [
    "error",
    # third-party: FastAPI re-exports the starlette TestClient at import time
    "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/infra/db/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", "quote-service", ".venv"]
# B104: the agent binds 0.0.0.0 on purpose; it only runs inside its container network.
skips = ["B104"]

# ---------------------------------------------------------------- architecture contracts
# Enforced in CI (`make arch`): the hexagonal boundaries described in the README.
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no application code, adapters or I/O frameworks"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = [
    "src.agent", "src.tools", "src.llm", "src.channels", "src.infra", "src.api",
    "src.simulation", "src.bootstrap", "src.main",
    "httpx", "sqlalchemy", "fastapi", "starlette", "structlog",
]

[[tool.importlinter.contracts]]
name = "Agent (application layer) depends on ports, never on concrete adapters"
type = "forbidden"
source_modules = ["src.agent"]
forbidden_modules = [
    "src.infra", "src.api", "src.channels", "src.simulation", "src.bootstrap", "src.main",
    "httpx", "sqlalchemy", "fastapi", "starlette",
]

[[tool.importlinter.contracts]]
name = "Outbound adapters do not depend on the application or delivery layers"
type = "forbidden"
source_modules = ["src.tools", "src.llm", "src.infra"]
forbidden_modules = ["src.agent", "src.api", "src.channels", "src.simulation", "src.bootstrap", "src.main"]

[[tool.importlinter.contracts]]
name = "Only the composition root and entry points wire adapters together"
type = "forbidden"
source_modules = ["src.api.routes", "src.channels"]
forbidden_modules = ["src.infra.db.session", "src.llm.openai_compat", "src.tools.http_client"]
allow_indirect_imports = true  # routes may see the Container type via the composition root
